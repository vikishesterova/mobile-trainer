<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отзывы — тренажер по дарк-паттернам</title>
  <style>
    :root {
      --bg: #f5f2fa; --surface: #ffffff; --text: #292633;
      --muted: #686273; --border: #ded6e9; --accent: #7151ad;
      --good: #397a52; --good-bg: #eaf7ef;
      --warn: #b33236; --warn-bg: #fdecee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
    h1 { font-size: 26px; margin: 0; letter-spacing: -0.4px; }
    .refresh {
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      padding: 10px 18px; border-radius: 12px; font-size: 15px; font-weight: 700;
    }
    .refresh:active { transform: translateY(1px); }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 24px; }
    .stat {
      flex: 1; min-width: 130px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px;
    }
    .stat .num { font-size: 30px; font-weight: 800; }
    .stat .lab { font-size: 13px; color: var(--muted); }
    .stat.avg .num { color: var(--accent); }
    .empty {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; text-align: center; color: var(--muted);
    }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 20px;
    }
    .item-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 14px; font-weight: 800; min-width: 34px; height: 34px;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
    }
    .badge.good { background: var(--good-bg); color: var(--good); }
    .badge.bad { background: var(--warn-bg); color: var(--warn); }
    .date { font-size: 13px; color: var(--muted); margin-left: auto; }
    .comment { font-size: 16px; color: var(--text); }
    .comment.none { color: var(--muted); font-style: italic; }
    .note { font-size: 13px; color: var(--muted); margin-top: 24px; text-align: center; }
    .error {
      background: var(--warn-bg); color: var(--warn); border: 1px solid #e8a8b0;
      border-radius: 16px; padding: 20px 24px; margin-bottom: 16px;
    }
    .loading { color: var(--muted); padding: 24px 0; text-align: center; }
    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .stat { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Отзывы о тренажере</h1>
      <button class="refresh" id="refresh">Обновить</button>
    </header>

    <div class="stats" id="stats"></div>
    <div id="status"></div>
    <div class="list" id="list"></div>
    <div class="note">Данные подтягиваются из Google Таблицы. Требуется доступ к интернету.</div>
  </div>

  <script>
    // URL Google Apps Script (Web App) — тот же, что в тренажере.
    // Подставьте реальный URL после настройки таблицы.
    var DATA_ENDPOINT = "";

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }

    function stars(rating) {
      var n = Math.max(0, Math.min(5, Number(rating) || 0));
      var filled = "★★★★★".slice(0, n);
      var rest = "☆☆☆☆☆".slice(0, 5 - n);
      return '<span class="stars">' + filled + rest + "</span>";
    }

    function load() {
      var status = document.getElementById("status");
      var list = document.getElementById("list");
      var stats = document.getElementById("stats");

      if (!DATA_ENDPOINT) {
        status.innerHTML = '<div class="error">Дашборд ещё не подключен: вставьте URL Apps Script в DATA_ENDPOINT.</div>';
        list.innerHTML = "";
        stats.innerHTML = "";
        return;
      }

      status.innerHTML = '<div class="loading">Загружаем ответы…</div>';
      fetch(DATA_ENDPOINT, { method: "GET", mode: "cors" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
          status.innerHTML = "";
          var rows = Array.isArray(data) ? data : [];
          render(rows);
        })
        .catch(function (err) {
          status.innerHTML = '<div class="error">Не удалось загрузить данные: ' + esc(err.message) + ".</div>";
          list.innerHTML = "";
          stats.innerHTML = "";
        });
    }

    function render(rows) {
      var list = document.getElementById("list");
      var stats = document.getElementById("stats");

      if (!rows.length) {
        stats.innerHTML = "";
        list.innerHTML = '<div class="empty">Ответов пока нет.</div>';
        return;
      }

      var total = rows.length;
      var rated = rows.filter(function (r) { return Number(r.rating) > 0; }).length;
      var sum = rows.reduce(function (acc, r) { return acc + (Number(r.rating) || 0); }, 0);
      var avg = rated ? (sum / rated) : 0;
      var commented = rows.filter(function (r) { return r.comment && String(r.comment).trim(); }).length;

      stats.innerHTML =
        '<div class="stat"><div class="num">' + total + '</div><div class="lab">ответов</div></div>' +
        '<div class="stat avg"><div class="num">' + (rated ? avg.toFixed(1) : "—") + '</div><div class="lab">средняя оценка</div></div>' +
        '<div class="stat"><div class="num">' + commented + '</div><div class="lab">с комментарием</div></div>';

      var html = "";
      rows.forEach(function (r) {
        var rating = Number(r.rating) || 0;
        var cls = rating >= 4 ? "good" : (rating >= 1 ? "bad" : "good");
        var badge = rating >= 1 ? String(rating) : "—";
        var date = r.date ? new Date(r.date) : null;
        var dateStr = date && !isNaN(date) ? date.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
        var comment = r.comment && String(r.comment).trim() ? String(r.comment) : "";
        html += '<div class="item">' +
          '<div class="item-top">' +
            '<span class="badge ' + cls + '">' + esc(badge) + '</span>' +
            (rating >= 1 ? stars(rating) : "") +
            '<span class="date">' + esc(dateStr) + '</span>' +
          '</div>' +
          '<div class="comment' + (comment ? "" : " none") + '">' + (comment ? esc(comment) : "Без комментария") + '</div>' +
        '</div>';
      });
      list.innerHTML = html;
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
