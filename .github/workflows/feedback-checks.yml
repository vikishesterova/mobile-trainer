name: Feedback delivery checks
on:
  pull_request:
    paths:
      - 'feedback/relay/**'
      - 'js/app.js'
      - '.github/workflows/feedback-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test feedback/relay/*.test.mjs
